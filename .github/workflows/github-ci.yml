name: customer application
run-name: pipeline for branch ${{ github.ref_name }}

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  BUILD_TYPE: Release

jobs:
  define-matrix:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Define matrix
        id: matrix
        shell: bash
        run: |
          {
            echo 'matrix<<EOF'
            echo '[{"runner":"ubuntu-26.04","image":"linuxdeepin/deepin:crimson"},{"runner":"ubuntu-26.04-arm","image":"linuxdeepin/deepin:crimson-arm64"}]'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    needs: define-matrix

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - run: apt update && apt install -y lsb-release python3 python3-venv python3-pip build-essential
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: /tmp/pip-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pip-conan
      - run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --cache-dir /tmp/pip-cache conan

      - uses: actions/cache@v5
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./Chapter10/customer/conanfile.txt') }}

      - name: create default profile
        run: |
          . venv/bin/activate
          conan profile detect -f

      - name: prepare environment
        uses: ./.github/actions/prepare-environment

      - name: install dependencies
        run: |
          . venv/bin/activate
          cd ${GITHUB_WORKSPACE}/build
          conan install ${GITHUB_WORKSPACE}/Chapter10/customer --build=missing \
          -s:a build_type=${{env.BUILD_TYPE}} -s:a compiler.cppstd=gnu20 -of .
        shell: bash

      - name: configure
        run: |
          cmake -GNinja -B ${GITHUB_WORKSPACE}/build -DBUILD_TESTING=ON \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${GITHUB_WORKSPACE}/Chapter10/customer

      - name: build
        run: cmake --build ${GITHUB_WORKSPACE}/build --config ${{env.BUILD_TYPE}}

      - name: upload build directory
        uses: ./.github/actions/upload-build-dir
        with:
          artifact-name: build-dir-${{ runner.arch }}

  test:
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    needs:
      - define-matrix
      - build

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: prepare environment
        uses: ./.github/actions/prepare-environment

      - name: download build directory
        uses: ./.github/actions/download-build-dir
        with:
          artifact-name: build-dir-${{ runner.arch }}

      - name: test
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ctest -C ${{env.BUILD_TYPE}}

  pack:
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    needs:
      - define-matrix
      - test

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: prepare environment
        uses: ./.github/actions/prepare-environment

      - name: download build directory
        uses: ./.github/actions/download-build-dir
        with:
          artifact-name: build-dir-${{ runner.arch }}

      - name: pack
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cpack .

      - uses: actions/upload-artifact@v7
        with:
          name: customer packages-${{ runner.arch }}
          path: |
            build/Customer*.deb
            build/Customer*.rpm
