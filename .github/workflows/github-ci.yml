name: customer application
run-name: pipeline for branch ${{ github.ref_name }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  define-matrix:
    runs-on: ubuntu-latest

    outputs:
      runners: ${{ steps.runners.outputs.runners }}

    steps:
      - name: Define Runners
        id: runners
        run: |
          echo 'runners=["ubuntu-26.04", "ubuntu-26.04-arm"]' >> "$GITHUB_OUTPUT"

  build:
    runs-on: ${{ matrix.runner }}
    needs: define-matrix

    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.define-matrix.outputs.runners) }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'
      - run: pip install conan

      - uses: actions/cache@v5
        with:
          path: |
            ~/.conan2
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('./Chapter10/customer/conanfile.txt') }}

      - name: create default profile
        run: conan profile detect -f

      - name: prepare environment
        uses: ./.github/actions/prepare-environment

      - name: install dependencies
        working-directory: ${{github.workspace}}/build
        run: "conan install ${{github.workspace}}/Chapter10/customer --build=missing -s:a build_type=${{env.BUILD_TYPE}}
        -s:a compiler=gcc -s:a compiler.version=14 -s:a compiler.cppstd=gnu20 -of ."

      - name: configure
        run: "cmake -GNinja -B ${{github.workspace}}/build -DCMAKE_CXX_COMPILER=`which g++-14` -DBUILD_TESTING=ON
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{github.workspace}}/Chapter10/customer"

      - name: build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

      - name: upload build directory
        uses: ./.github/actions/upload-build-dir
        with:
          artifact-name: build-dir-${{ runner.arch }}

  test:
    runs-on: ${{ matrix.runner }}
    needs:
      - define-matrix
      - build

    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.define-matrix.outputs.runners) }}

    steps:
      - uses: actions/checkout@v6

      - name: prepare environment
        uses: ./.github/actions/prepare-environment

      - name: download build directory
        uses: ./.github/actions/download-build-dir
        with:
          artifact-name: build-dir-${{ runner.arch }}

      - name: test
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}}

  pack:
    runs-on: ${{ matrix.runner }}
    needs:
      - define-matrix
      - test

    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.define-matrix.outputs.runners) }}

    steps:
      - uses: actions/checkout@v6

      - name: prepare environment
        uses: ./.github/actions/prepare-environment

      - name: download build directory
        uses: ./.github/actions/download-build-dir
        with:
          artifact-name: build-dir-${{ runner.arch }}

      - name: pack
        working-directory: ${{github.workspace}}/build
        run: cpack .

      - uses: actions/upload-artifact@v7
        with:
          name: customer packages-${{ runner.arch }}
          path: |
            build/Customer*.deb
            build/Customer*.rpm
